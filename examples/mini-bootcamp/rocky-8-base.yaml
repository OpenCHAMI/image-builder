options:
  layer_type: 'base'
  name: 'rocky8-base'
  publish_tags: '8.9'
  pkg_manager: 'dnf'
  parent: 'scratch'
  publish_registry: 'registry.lovelltroy.net'
  registry_opts_push:
    - '--tls-verify=false'

repos:
  - alias: 'Rock_BaseOS'
    config: |
      baseurl=https://download.rockylinux.org/pub/rocky/8/BaseOS/x86_64/os/
      enabled=1
      gpgcheck=1
    gpg_key: 'https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-8'
  - alias: 'Rock_AppStream'
    config: |
      baseurl=https://download.rockylinux.org/pub/rocky/8/AppStream/x86_64/os/
      enabled=1
      gpgcheck=1
    gpg_key: 'https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-8'
  - alias: 'Rock_PowerTools'
    config: |
      baseurl=https://dl.rockylinux.org/pub/rocky/8/PowerTools/x86_64/os
      enabled=1
      gpgcheck=1
    gpg_key: 'https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-8'
  - alias: 'Epel'
    config: |
      baseurl=https://dl.fedoraproject.org/pub/epel/8/Everything/x86_64/
      enabled=1
      gpgcheck=1
    gpg_key: 'https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-8'
  - alias: 'elrepo'
    config: |
      baseurl=http://elrepo.org/linux/elrepo/el8/x86_64/
      enabled=1
      gpgcheck=1
    gpg_key: 'https://www.elrepo.org/RPM-GPG-KEY-elrepo.org'

package_groups:
  - 'Minimal Install'

packages:
  - kernel
  - wget
  - dracut-live
  - dmidecode
  - tpm2-tools
  - tpm2-abrmd
  - tpm2-tss
  - vim
  - curl
  - tmux
  - cloud-init
  - wireguard-tools
  - kmod-wireguard
  - jq

copyfiles:
  - src: '/data/mini-bootcamp/files/cloud-init-override.conf'
    dest: '/etc/systemd/system/cloud-init.service.d/override.conf'
  - src: '/data/mini-bootcamp/files/ochami-ci-setup.sh'
    dest: '/usr/local/bin/ochami-ci-setup.sh'

cmds:
  - cmd: 'dracut --add "dmsquash-live livenet network-manager" --kver $(basename /lib/modules/*) -N -f --logfile /tmp/dracut.log 2>/dev/null'
  - cmd: 'echo DRACUT LOG:; cat /tmp/dracut.log'
